# ==============================================================================
# ~/.tmux.conf
# Prefix: Ctrl-a  (more ergonomic than Ctrl-b)
# ==============================================================================

# -- Prefix key ----------------------------------------------------------------
# Change prefix from default Ctrl-b to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# -- General -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -g history-limit 50000      # scrollback buffer
set -g mouse on                 # mouse scroll, click to select pane/window
set -g focus-events on          # pass focus events to vim/nvim
set -sg escape-time 10          # remove delay after Escape (important for nvim)
set -g display-time 2000        # status messages stay 2 s
set -g status-interval 1        # refresh status bar every 1 s

# -- Indexing ------------------------------------------------------------------
set -g base-index 1             # start window numbering at 1 instead of 0
set -g pane-base-index 1        # start pane numbering at 1 instead of 0
set -g renumber-windows on      # renumber windows after closing one

# -- Reload config -------------------------------------------------------------
# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display 'Reload Tmux Config.'

# -- Window / pane creation ----------------------------------------------------
# Open new panes in the same directory as the current pane
bind c new-window -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"   # vertical split using '\'
bind - split-window -v -c "#{pane_current_path}"    # horizontal split using '-'

# -- Pane navigation (vim-like + mouse) ----------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -- Pane resizing -------------------------------------------------------------
# Prefix + Shift + H/J/K/L to resize panes by 5 cells (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -- Window navigation ---------------------------------------------------------
# Use default prefix + n/p to move to next/previous window

# -- Copy mode (vim bindings) --------------------------------------------------
set-window-option -g mode-keys vi                         # use vim keybindings in copy mode
bind Enter copy-mode                                      # prefix + Enter to enter copy mode
# Use vim-like keys to navigate and select text in copy mode
bind -T copy-mode-vi v send -X begin-selection            # v to start selection
bind -T copy-mode-vi C-v send -X rectangle-toggle         # Ctrl-v to toggle rectangle selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel  # y to copy selection and exit copy mode
bind -T copy-mode-vi Escape send -X cancel                # Escape to exit copy mode without copying

# -- Plugins (TPM) -------------------------------------------------------------
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Install plugins: prefix + I
# Update plugins:  prefix + U
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # seamless navigation between vim and tmux
set -g @plugin 'tmux-plugins/tmux-yank'           # better clipboard integration
set -g @plugin 'dracula/tmux'                     # colour scheme

# -- Install tmux plugin manager if it does not exist --------------------------
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# -- Initialize TPM (must be last line) ----------------------------------------
run '~/.tmux/plugins/tpm/tpm'
